<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#18181b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout Forge — visual generators for design and front-end</title>
    <meta name="description" content="Free open source visual generators for design and front-end work: Grid, Flex, palettes, backgrounds, 3D, mockups. Runs in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Layout Forge" />
    <meta property="og:description" content="Visual generators for design and front-end work — in your browser, no account, no server." />
    <meta property="og:image" content="https://vumox.github.io/layout-forge/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        var t = localStorage.getItem("lf-theme")
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
